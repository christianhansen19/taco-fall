    <link rel="icon" type="image/png" sizes="32x32" href="/taco-fall/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/taco-fall/apple-touch-icon.png" />

      rel="stylesheet"
    />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
      /* Minimal render-blocking reset so a hard reload never flashes unstyled.
         Everything else lives in src/styles/. */
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        background: #fbf3e7;
      }
      html[data-theme='dark'] body {
        background: #1e1517;
      }
    </style>

    <script>
      // Resolve the theme before React mounts, so a dark-mode user never gets a
      // flash of cream. Mirrors the logic in src/theme.js.
      ;(function () {
        try {
          var p = localStorage.getItem('tacoTheme_v2') || localStorage.getItem('tacoTheme_v1') || 'system'
          var dark = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.querySelector('meta[name="theme-color"]').content = dark ? '#1E1517' : '#FBF3E7'
        } catch (e) {}
      })()
    </script>
